<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Vaquinha app</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone login">
    <h1>Vaquinha app</h1>

    <!-- Visual apenas: o botão só leva para o dashboard -->
    <label for="usuario">E-mail ou Usuário</label>
    <input id="usuario" type="text" placeholder="Digite seu e-mail ou usuário">

    <label for="senha">Senha</label>
    <input id="senha" type="password" placeholder="Digite sua senha">

    <a class="btn" href="dashboard.html">Entrar</a>
    <a class="link" href="#">Esqueci minha senha</a>

    <p class="rodape">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
  </main>
</body>
</html>
